<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up — Jeevan</title>

    <link rel="icon" type="image/png" href="logo1.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            <img src="logo1.png" alt="Jeevan">
        </div>

        <h2>Create Your Account</h2>

        <p class="auth-subtitle">
            Join Jeevan and help save lives
        </p>

        <form id="signupForm">

            <p class="form-group" style="margin-bottom: 5px;">
                <label>I want to</label>
            </p>

            <div class="role-selector">

                <div class="role-option">
                    <input
                        type="radio"
                        name="role"
                        id="role-donor"
                        value="donor"
                        checked
                    >

                    <label for="role-donor">
                        🩸 Donate Blood
                    </label>
                </div>

                <div class="role-option">
                    <input
                        type="radio"
                        name="role"
                        id="role-recipient"
                        value="recipient"
                    >

                    <label for="role-recipient">
                        🔍 Find Blood
                    </label>
                </div>

            </div>

            <div class="form-group">
                <label for="signupName">Full Name</label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="signupEmail">Email</label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="your@email.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="signupPhone">Phone Number</label>

                <input
                    type="tel"
                    id="signupPhone"
                    placeholder="Enter your phone number"
                    required
                >
            </div>

            <div class="form-group">
                <label for="signupBloodGroup">
                    Blood Group
                </label>

                <select id="signupBloodGroup" required>

                    <option value="">
                        Select Blood Group
                    </option>

                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>

                </select>
            </div>

            <div class="form-group">
                <label for="signupPassword">Password</label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >
            </div>

            <p id="signupMessage"></p>

            <button
                type="submit"
                class="form-btn"
            >
                Create Account
            </button>

        </form>

        <div class="auth-footer">
            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </div>

    </div>

</div>

<script src="signup.js"></script>

</body>
</html>
