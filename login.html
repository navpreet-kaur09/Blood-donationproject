<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Jeevan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


<div class="auth-page">
    <div class="auth-card">

        <div class="auth-logo">
            <a href="index.html">
                <img src="logo1.png" alt="Jeevan">
            </a>
        </div>

        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Login to your Jeevan account</p>

        <form>
            <div class="form-group">
                <label>Email or Phone</label>
                <input type="text" placeholder="Enter your email or phone">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password">
            </div>

            <a href="#" class="forgot-link">Forgot Password?</a>

            <button type="button" class="form-btn">Login</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
        </div>

    </div>
</div>

</body>
</html>
