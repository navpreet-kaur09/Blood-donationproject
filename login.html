<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — Jeevan</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            <a href="index.html">
                <img src="logo1.png" alt="Jeevan">
            </a>
        </div>


        <h2>Welcome Back</h2>

        <p class="auth-subtitle">
            Login to your Jeevan account
        </p>


        <!-- LOGIN FORM -->

        <form id="loginForm">

            <div class="form-group">

                <label>Email or Phone</label>

                <input
                    type="text"
                    id="loginEmail"
                    placeholder="Enter your email or phone"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <a href="#" class="forgot-link">
                Forgot Password?
            </a>


            <button
                type="submit"
                class="form-btn">
                Login
            </button>


            <!-- JavaScript message -->

            <p id="loginMessage"></p>

        </form>


        <div class="auth-footer">

            <p>
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>

        </div>

    </div>

</div>


<script src="login.js"></script>

</body>
</html>
